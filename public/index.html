<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E0E10" />

    <!--
      PRIVACY NOTE - please read before adding anything here.

      This page loads NOTHING from a third party. No Google Fonts, no
      analytics, no tag manager, no social widgets, no CDN. Everything the
      browser downloads comes from your own server.

      Why that matters: a single <link> to fonts.googleapis.com sends every
      visitor's IP address and page URL to another company before they have
      agreed to anything. That is the kind of thing a cookie banner exists
      to cover. By using the fonts already on the visitor's device, there is
      nothing to disclose and nothing to ask consent for.

      If you later add an analytics script, a map, or an embedded video, you
      MUST update /privacy-policy and /cookie-policy to say so, and you may
      need consent before it loads. See the notes in those two pages.
    -->

    <meta
      name="description"
      content="Find a barber and book your next appointment. Browse barbers, compare services, choose a time, and book online."
    />

    <!-- Original icon made for this project. See favicon.svg. -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />

    <title>VEYRON</title>
  </head>
  <body>
    <noscript>
      This site needs JavaScript to load barbers and make bookings. Please
      turn JavaScript on, or contact the business directly to book.
    </noscript>

    <!-- React mounts here. See src/index.js -->
    <div id="root"></div>
  </body>
</html>
